name: Quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate course structure
        run: python3 scripts/validate_course.py
      - name: Validate the clean student journey
        run: python3 scripts/validate_student_journey.py
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:browser
      - name: Run the clean lab
        working-directory: assets/agentic-analytics-lab
        run: python3 verify.py
      - name: Confirm impossible data is refused
        working-directory: assets/agentic-analytics-lab
        shell: bash
        run: |
          set +e
          output=$(python3 verify.py --inject-impossible-row 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2
          grep -q 'OUTCOME: Refuse' <<< "$output"
      - name: Confirm benchmark conflict routes to review
        working-directory: assets/agentic-analytics-lab
        run: |
          python3 verify.py --inject-benchmark-conflict | tee /tmp/benchmark-conflict.txt
          grep -q 'OUTCOME: Review' /tmp/benchmark-conflict.txt

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
